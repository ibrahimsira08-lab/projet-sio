
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - NEXORA</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="page-connexion">

    <!-- HEADER -->
    <header class="connexion-header">

        <h1>NEXORA</h1>

        <nav>
            <a href="index.html">Accueil</a>
            <a href="index.html#mangas">Mangas</a>
            <a href="index.html#jeux">Jeux vidéo</a>
        </nav>

    </header>


    <!-- CONNEXION -->
    <main class="connexion-main">

        <div class="connexion-titre">
            <h2>Connexion</h2>
            <p>Connectez-vous à votre compte NEXORA.</p>
        </div>

        <form action="#" method="post">

            <p>
                <label for="identifiant">Adresse mail ou téléphone :</label>
                <input type="text" id="identifiant" name="identifiant" required>
            </p>

            <p>
                <label for="motdepasse">Mot de passe :</label>
                <input type="password" id="motdepasse" name="motdepasse" required>
            </p>

            <p>
                <a href="#">Mot de passe oublié ?</a>
            </p>

            <input type="submit" value="Se connecter">

        </form>

        <div class="creation-compte">
            <p>Vous n'avez pas de compte ?</p>
            <a href="inscription.html">Créer un compte</a>
        </div>

    </main>


    <!-- FOOTER -->
    <footer class="connexion-footer">
        <p>© 2026 NEXORA - Jouez. Lisez. Explorez.</p>
    </footer>

</body>
</html>
